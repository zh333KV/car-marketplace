<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль продавца</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/}">Продажа авто</a>
        <nav class="nav">
            <a th:href="@{/ads}">Объявления</a>
        </nav>
    </div>
</header>
<main class="container">
    <section class="panel">
        <h1 class="page-title" th:text="${seller.firstName}"></h1>
        <div class="profile-list">
            <p class="meta">Email: <span th:text="${seller.email}"></span></p>
            <p class="meta">Телефон: <span th:text="${seller.phone}"></span></p>
            <p class="meta">Город: <span th:text="${seller.city}"></span></p>
        </div>
        <h2>Объявления продавца</h2>
        <div class="empty" th:if="${#lists.isEmpty(sellerAds)}">
            У продавца пока нет объявлений
        </div>
        <div class="cards" th:unless="${#lists.isEmpty(sellerAds)}">
            <article class="card" th:each="ad : ${sellerAds}">
                <div class="card-media" th:if="${ad.mainImage != null}">
                    <img class="js-image-modal" th:src="@{${ad.mainImage}}" alt="Фото объявления">
                </div>
                <div class="card-media" th:unless="${ad.mainImage != null}"></div>
                <div class="card-body">
                    <h3 class="card-title">
                        <a th:href="@{/ads/{id}(id=${ad.id})}" th:text="${ad.title}"></a>
                    </h3>
                    <p class="price" th:text="'$' + ${ad.price}"></p>
                    <p class="meta" th:if="${ad.author != null and ad.author.phone != null and !#strings.isEmpty(ad.author.phone)}">
                        Телефон: <span th:text="${ad.author.phone}"></span>
                    </p>
                </div>
            </article>
        </div>
    </section>
</main>
<script th:src="@{/js/image-modal.js}"></script>
</body>
</html>
