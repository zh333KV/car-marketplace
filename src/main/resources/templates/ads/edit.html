<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать объявление</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container">
    <section class="panel">
        <h1 class="page-title">Редактирование объявления</h1>
        <form class="form-grid" th:action="@{/ads/edit/{id}(id=${adId})}" th:object="${adCreateRequest}" method="post">
            <div>
                <label class="label">Название</label>
                <input class="input" type="text" th:field="*{title}">
                <div class="errors" th:errors="*{title}"></div>
            </div>
            <div>
                <label class="label">Описание</label>
                <textarea class="textarea" th:field="*{description}"></textarea>
                <div class="errors" th:errors="*{description}"></div>
            </div>
            <div>
                <label class="label">Цена</label>
                <input class="input" type="number" step="0.01" th:field="*{price}">
                <div class="errors" th:errors="*{price}"></div>
            </div>
            <div>
                <label class="label">Город</label>
                <input class="input" type="text" th:field="*{city}">
                <div class="errors" th:errors="*{city}"></div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Сохранить</button>
                <a class="btn btn-muted" th:href="@{/ads/{id}(id=${adId})}">Отмена</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
