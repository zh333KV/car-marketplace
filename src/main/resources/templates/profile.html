<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container">
    <section class="panel">
        <h1 class="page-title">Мой профиль</h1>
        <div class="profile-list">
            <p class="meta">Имя: <span th:text="${user.firstName}"></span></p>
            <p class="meta">Email: <span th:text="${user.email}"></span></p>
            <p class="meta">Телефон: <span th:text="${user.phone}"></span></p>
            <p class="meta">Город: <span th:text="${user.city}"></span></p>
        </div>
        <h2>Мои объявления</h2>
        <div class="empty" th:if="${#lists.isEmpty(myAds)}">
            У вас пока нет объявлений
        </div>
        <div class="cards" th:unless="${#lists.isEmpty(myAds)}">
            <article class="card" th:each="ad : ${myAds}">
                <div class="card-media" th:if="${ad.mainImage != null}">
                    <img class="js-image-modal" th:src="@{${ad.mainImage}}" alt="Фото объявления">
                </div>
                <div class="card-media" th:unless="${ad.mainImage != null}"></div>
                <div class="card-body">
                    <h3 class="card-title">
                        <a th:href="@{/ads/{id}(id=${ad.id})}" th:text="${ad.title}"></a>
                    </h3>
                    <p class="price" th:text="'$' + ${ad.price}"></p>
                    <p class="meta" th:text="${ad.city}"></p>
                    <p class="meta" th:if="${ad.author != null and ad.author.phone != null and !#strings.isEmpty(ad.author.phone)}">
                        Телефон: <span th:text="${ad.author.phone}"></span>
                    </p>
                </div>
            </article>
        </div>
    </section>
</main>
<script th:src="@{/js/image-modal.js}"></script>
</body>
</html>
