<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container">
    <section class="panel" style="max-width: 460px; margin: 0 auto;">
        <h1 class="page-title">Вход</h1>
        <div class="errors" th:if="${param.error}">
            Неверный логин или пароль
        </div>
        <form class="form-grid" th:action="@{/auth/login}" method="post">
            <div>
                <label class="label">Email</label>
                <input class="input" type="text" name="username" required>
            </div>
            <div>
                <label class="label">Пароль</label>
                <input class="input" type="password" name="password" required>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Войти</button>
                <a class="btn btn-muted" th:href="@{/}">Главная</a>
            </div>
        </form>
        <p class="meta">Нет аккаунта? <a th:href="@{/auth/register}">Зарегистрируйтесь</a></p>
    </section>
</main>
</body>
</html>
