<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/}">Продажа авто</a>
        <nav class="nav">
            <a th:href="@{/ads}">Все объявления</a>
            <a th:href="@{/ads/create}">Подать объявление</a>
            <span sec:authorize="isAnonymous()">
                <a th:href="@{/auth/login}">Вход</a>
                <a th:href="@{/auth/register}">Регистрация</a>
            </span>
            <span sec:authorize="isAuthenticated()">
                <a th:if="${currentUser != null}"
                   th:href="@{/users/{id}(id=${currentUser.id})}"
                   th:text="${currentUser.firstName}">
                </a>
            </span>
            <form sec:authorize="isAuthenticated()" th:action="@{/auth/logout}" method="post">
                <button class="btn btn-muted" type="submit">Выйти</button>
            </form>
        </nav>
    </div>
</header>

<main class="container">
    <section class="panel">
        <h1 class="page-title">Свежие объявления</h1>
        <div class="empty" th:if="${#lists.isEmpty(ads)}">
            Пока нет объявлений
        </div>
        <div class="cards" th:unless="${#lists.isEmpty(ads)}">
            <article class="card" th:each="ad : ${ads}">
                <div class="card-media" th:if="${ad.mainImage != null}">
                    <img class="js-image-modal" th:src="@{${ad.mainImage}}" alt="Фото объявления">
                </div>
                <div class="card-media" th:unless="${ad.mainImage != null}"></div>
                <div class="card-body">
                    <h3 class="card-title">
                        <a th:href="@{/ads/{id}(id=${ad.id})}" th:text="${ad.title}"></a>
                    </h3>
                    <p class="price" th:text="'$' + ${ad.price}"></p>
                    <p class="meta" th:text="${ad.city}"></p>
                    <p class="meta" th:if="${ad.author != null and ad.author.phone != null and !#strings.isEmpty(ad.author.phone)}">
                        Телефон: <span th:text="${ad.author.phone}"></span>
                    </p>
                </div>
            </article>
        </div>
    </section>
</main>
<script th:src="@{/js/image-modal.js}"></script>
</body>
</html>
